AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Traxent user-data stack — DynamoDB table + Lambda + HTTP API that persists per-user
  lesson/quiz progress, paper trades, and firm selections. Replaces browser localStorage
  so a user's progress and trade history follow them across devices.

  This is real infrastructure-as-code: `sam deploy` (or the deploy-infra GitHub Action)
  creates/updates everything below. It is a SEPARATE stack from the existing manually-
  deployed payment Lambdas, so it does not touch the Stripe/checkout endpoint.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures: [arm64]

Parameters:
  Auth0Issuer:
    Type: String
    Default: https://auth.traxent.io/
    Description: Auth0 token issuer (custom domain, trailing slash).
  Auth0Audience:
    Type: String
    Default: ilvfACgF2sCmLWaugCn11qTB04aTvWxz,YKvrjZoxnehdES7nmMs9SRXi3G0MdXcK
    Description: Comma-separated ID-token audiences to accept — web SPA Client ID and iOS native Client ID.
  AllowedOrigin:
    Type: String
    Default: https://traxent.io
    Description: CORS allowed origin for the API.
  AdminSubs:
    Type: String
    Default: ''
    Description: >
      Comma-separated Auth0 user IDs (the token `sub`, e.g. auth0|abc123) allowed
      to view the aggregate admin metrics dashboard. Empty (the default) denies
      EVERYONE — set this to your own Auth0 user id (shown as "Account ID" on the
      /account page) to grant yourself access.
    NoEcho: true
  ResendSegmentName:
    Type: String
    Default: Traxent waitlist
    Description: >
      Name of the Resend segment (formerly "audience") that new signups are
      mirrored into. Must match SEGMENT_NAME in
      backend/marketing/campaign.config.mjs, or the broadcast will go out to a
      different list from the one being populated.
  EmailFrom:
    Type: String
    Default: Traxent <hello@traxent.io>
    Description: From address for the instant invite email. The domain must be verified in Resend.
  EmailReplyTo:
    Type: String
    Default: hello@traxent.io
    Description: Reply-To for the instant invite email.
  PostalAddress:
    Type: String
    Default: Akpan Holdings Limited registered office, 167-169 Great Portland Street, London, W1W 5PF, United Kingdom
    Description: >
      Sender's registered address, shown in the invite footer. Not legally
      required on a transactional email the way it is on marketing, but inbox
      providers treat a complete sender identity as a positive signal.

Resources:

  UserDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TraxentUserData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ── Marketing / waitlist subscribers ──────────────────────────────────────
  # The system of record for the mailing list, replacing Formspree. Resend is a
  # mirror we push to and receive events from; this table is the truth, and the
  # only place the consent evidence (timestamp, IP, wording shown) is stored.
  #
  # Partition key is the lowercased email itself — one row per person, so a
  # duplicate signup is an idempotent overwrite rather than a duplicate record.
  #
  # StatusIndex exists so exports and counts can Query by status instead of
  # Scanning the whole table. Rate-limit counter rows deliberately carry neither
  # `status` nor `createdAt`, so DynamoDB never projects them into the index.
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TraxentSubscribers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # Expires the per-IP rate-limit counters. Subscriber rows never set
      # `expiresAt`, so they are never touched by the TTL sweeper.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ── Enterprise ────────────────────────────────────────────────────────────
  # One table, two record shapes, distinguished by the `pk` prefix:
  #
  #   ORG#<orgId>      an enterprise customer: seats, domain, SSO connection,
  #                    hashed SCIM token, status
  #   LEAD#<uuid>      an inbound sales enquiry from /enterprise
  #   ORG#<orgId>      sk=USER#<scimId>  a SCIM-provisioned user in that org
  #
  # Single table because these are always queried together by org, and because
  # a second table for a handful of enterprise records is cost and ceremony for
  # nothing. The GSI exists so SCIM can resolve a bearer token to an org in one
  # lookup, and so leads can be listed by date without a scan.
  EnterpriseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TraxentEnterprise
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: lookupKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Resolves a SCIM token hash, an SSO connection id, or an email domain
        # to its organisation. Only records that set lookupKey are projected.
        - IndexName: LookupIndex
          KeySchema:
            - AttributeName: lookupKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # SCIM 2.0 provisioning (RFC 7643 / 7644). Identity providers — Okta, Entra
  # ID, JumpCloud — call this to create, update and deactivate users when
  # someone joins or leaves the customer's directory.
  #
  # Authenticated by a per-organisation bearer token, NOT Auth0: the IdP is a
  # machine with no user session. The token is stored only as a SHA-256 hash,
  # so a leak of this table doesn't hand over provisioning rights.
  ScimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-scim
      Handler: index.handler
      CodeUri: functions/scim/
      Timeout: 15
      Environment:
        Variables:
          ENTERPRISE_TABLE: !Ref EnterpriseTable
          USER_DATA_TABLE: !Ref UserDataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EnterpriseTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        ScimRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /scim/v2/{proxy+}
            Method: ANY

  # Inbound enterprise enquiries from /enterprise. Public, same abuse controls
  # as /subscribe. Notifies the alerts topic so a lead can't sit unseen.
  EnterpriseEnquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-enterprise-enquiry
      Handler: index.handler
      CodeUri: functions/enterprise-enquiry/
      Timeout: 15
      Environment:
        Variables:
          ENTERPRISE_TABLE: !Ref EnterpriseTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EnterpriseTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
      Events:
        Enquiry:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /enterprise/enquiry
            Method: POST

  # PUBLIC endpoint — no Auth0 token, by necessity: the people signing up don't
  # have accounts yet. Protected by a honeypot field, strict server-side address
  # validation, a per-IP hourly cap enforced in DynamoDB, and the API's stage
  # throttling. Reads the Resend key from SSM to mirror each contact across.
  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-subscribe
      Handler: index.handler
      CodeUri: functions/subscribe/
      Timeout: 15
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          RESEND_KEY_PARAM: /traxent/resend/api_key
          RESEND_SEGMENT_NAME: !Ref ResendSegmentName
          EMAIL_FROM: !Ref EmailFrom
          EMAIL_REPLY_TO: !Ref EmailReplyTo
          POSTAL_ADDRESS: !Ref PostalAddress
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/resend/*"
      Events:
        Subscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /subscribe
            Method: POST

  # Receives Resend's unsubscribe / bounce / complaint / suppression events so
  # this table stays accurate. Public route, authenticated purely by the Svix
  # signature (verified in functions/resend-webhook/svix.mjs).
  ResendWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-resend-webhook
      Handler: index.handler
      CodeUri: functions/resend-webhook/
      Timeout: 15
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          RESEND_WEBHOOK_SECRET_PARAM: /traxent/resend/webhook_secret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/resend/*"
      Events:
        ResendWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /webhooks/resend
            Method: POST

  # Nightly reconciliation between this table and Resend.
  #
  # The live sync paths (subscribe, Stripe checkout, the account toggle) are
  # fast but lossy — one failed API call and the two systems disagree silently.
  # This job makes the live path trustworthy: it pushes anything still flagged
  # `resendSynced: false`, suppresses contacts that should be, clears contacts
  # left behind by an email change, and emails a summary ONLY when something
  # needed fixing. It never auto-resubscribes anyone; those are reported for a
  # human instead.
  ReconcileMarketingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-reconcile-marketing
      Handler: index.handler
      CodeUri: functions/reconcile-marketing/
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          RESEND_KEY_PARAM: /traxent/resend/api_key
          RESEND_SEGMENT_NAME: !Ref ResendSegmentName
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/resend/*"
      Events:
        Nightly:
          Type: Schedule
          Properties:
            # 03:15 UTC — after the day's activity, before anyone is awake to
            # send a broadcast off a stale list.
            Schedule: cron(15 3 * * ? *)
            Name: traxent-reconcile-marketing-nightly
            Description: Reconcile TraxentSubscribers with Resend.

  # The weekly readiness report the Challenger tier has been sold on.
  #
  # Monday 07:00 UTC: a trading week is Mon-Fri, so Monday morning is the point
  # where last week is complete and this week can still be changed.
  #
  # Only sends to members whose marketing-list status is `subscribed` — this is
  # a recurring email, so an unsubscribe has to actually stop it. Idempotent per
  # ISO week, and one member's failure never ends the run.
  ReadinessDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-readiness-digest
      Handler: index.handler
      CodeUri: functions/readiness-digest/
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          USER_DATA_TABLE: !Ref UserDataTable
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          RESEND_KEY_PARAM: /traxent/resend/api_key
          EMAIL_FROM: !Ref EmailFrom
          POSTAL_ADDRESS: !Ref PostalAddress
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/resend/*"
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 ? * MON *)
            Name: traxent-readiness-digest-weekly
            Description: Weekly readiness report to Challenger and Funded Trader members.

  UserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-user-data
      Handler: index.handler
      CodeUri: functions/user-data/
      Environment:
        Variables:
          TABLE_NAME: !Ref UserDataTable
          AUTH0_ISSUER: !Ref Auth0Issuer
          AUTH0_AUDIENCE: !Ref Auth0Audience
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/{proxy+}
            Method: ANY

  # Account deletion (App Review 5.1.1(v)). Isolated from the data CRUD function
  # because it holds the powerful Stripe + Auth0-admin permissions. The specific
  # `DELETE /user/account` route takes precedence over the data function's greedy
  # ANY /user/{proxy+}.
  AccountDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-delete-account
      Handler: index.handler
      CodeUri: functions/delete-account/
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref UserDataTable
          AUTH0_ISSUER: !Ref Auth0Issuer
          AUTH0_AUDIENCE: !Ref Auth0Audience
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          STRIPE_KEY_PARAM: /traxent/stripe/key_delete_account
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          RESEND_KEY_PARAM: /traxent/resend/api_key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/*"
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/account
            Method: DELETE

  # Market news feed (Funded tier). A NEW function — created, permissioned and
  # routed entirely by this stack (it never existed before, which is why it
  # wasn't in the Lambda console). Reads the provider key from SSM; caches
  # in-memory for 30 min inside the function. Code stays at backend/functions/news-feed.
  NewsFeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-news-feed
      Handler: index.handler
      CodeUri: ../functions/news-feed/
      Timeout: 15
      Environment:
        Variables:
          AUTH0_AUDIENCE: !Ref Auth0Audience
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/news/*"
      Events:
        News:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /news
            Method: GET

  # In-app account management: update name/email + trigger password reset via the
  # Auth0 Management API, so users never see Auth0's hosted profile UI. Isolated
  # from the data function because it holds Auth0-admin (m2m) permissions, like
  # delete-account. Its specific routes win over the data function's greedy
  # ANY /user/{proxy+}.
  AccountUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-account-update
      Handler: index.handler
      CodeUri: functions/account-update/
      Environment:
        Variables:
          AUTH0_ISSUER: !Ref Auth0Issuer
          AUTH0_AUDIENCE: !Ref Auth0Audience
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/*"
      Events:
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/profile
            Method: POST
        PasswordReset:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/password-reset
            Method: POST
        # The customer's own marketing opt-out. Soft opt-in under UK PECR is
        # only lawful if refusing is simple, so this route is a legal
        # requirement of emailing customers, not a nice-to-have. Both methods
        # are declared explicitly rather than ANY, so they take precedence over
        # the data function's greedy ANY /user/{proxy+}.
        MarketingGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/marketing
            Method: GET
        MarketingSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/marketing
            Method: POST

  # Admin-only aggregate metrics dashboard (GET /admin/metrics). Returns COUNTS
  # ONLY — total signups (Auth0 Mgmt API), active subs + MRR + plan mix (Stripe),
  # and usage totals (DynamoDB) — never any per-user record, so it stays low
  # privacy-risk. Two gates: verify the Auth0 ID token, then require the token
  # `sub` to be in the ADMIN_SUBS allow-list (empty ⇒ deny everyone). Isolated
  # from the data function because it reads the powerful Stripe + Auth0-admin
  # SSM params. Its specific /admin/metrics route is on a DIFFERENT base path
  # from the data function's greedy ANY /user/{proxy+}, so there is no overlap.
  AdminMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-admin-metrics
      Handler: index.handler
      CodeUri: functions/admin-metrics/
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref UserDataTable
          AUTH0_ISSUER: !Ref Auth0Issuer
          AUTH0_AUDIENCE: !Ref Auth0Audience
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ADMIN_SUBS: !Ref AdminSubs
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserDataTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/traxent/*"
      Events:
        Metrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /admin/metrics
            Method: GET
        MarketingPref:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/marketing
            Method: GET
        MarketingSet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserDataApi
            Path: /user/marketing
            Method: POST

  UserDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      # Stage-wide throttling — the rate-limit guardrail for this HTTP API.
      # AWS WAF/WAFv2 cannot attach to API Gateway HTTP APIs (only REST APIs),
      # so this replaces the per-IP WAF: it caps overall request volume (100 req/s
      # steady, 200 burst) against abuse/DoS. Raise if you see legitimate 429s.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  # ── Edge protection ───────────────────────────────────────────────────────
  # NOTE: AWS WAF (WAFv2) does NOT support API Gateway HTTP APIs — only REST APIs,
  # ALB, AppSync, Cognito, App Runner and Verified Access. The previous ApiWebAcl +
  # WebACLAssociation targeted this HTTP API and always failed with "The ARN isn't
  # valid", rolling the whole stack back. Rate limiting is now enforced by the API's
  # DefaultRouteSettings (see UserDataApi above). To get per-IP WAF later, front the
  # API with CloudFront and attach a WebACL to the distribution instead.

  # ── Alerting: SNS topic + email. Confirm the subscription from your inbox ──
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: traxent-alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: davidansa00@gmail.com

  # A signup that errors is a person lost for good — they saw a failure and
  # will not come back. Alarm tighter than the other functions.
  SubscribeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: traxent-subscribe-errors
      AlarmDescription: >
        Waitlist signups are failing. Every one of these is a lost subscriber —
        check CloudWatch logs for traxent-subscribe.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubscribeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  UserDataErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: traxent-user-data-errors
      AlarmDescription: user-data Lambda error spike (possible abuse or bug).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UserDataFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  DeleteAccountErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: traxent-delete-account-errors
      AlarmDescription: delete-account Lambda is failing — deletions may be stuck.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AccountDeleteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # (WafBlockedSpikeAlarm removed — no WAF is attached to this HTTP API; see the
  #  Edge protection note above. Throttling 429s surface via API Gateway metrics.)

  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: traxent-dynamodb-throttle
      AlarmDescription: DynamoDB is throttling requests on TraxentUserData (capacity pressure or hot-partition abuse).
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref UserDataTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # ── Cost guardrail: email at 80% actual / 100% forecast of $50/mo ─────────
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: traxent-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: davidansa00@gmail.com
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: davidansa00@gmail.com

Outputs:
  ApiBaseUrl:
    Description: Base URL for the user-data API. Put this in src/userdata.js (USERDATA_API).
    Value: !Sub "https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com"
  SubscribeUrl:
    Description: Public waitlist signup endpoint. Used by src/subscribe.js.
    Value: !Sub "https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com/subscribe"
  ResendWebhookUrl:
    Description: >
      Paste this into Resend → Webhooks as the endpoint URL, subscribed to
      contact.updated, contact.deleted, email.bounced, email.complained,
      suppression.added and suppression.removed. Then store the signing secret
      it gives you in SSM at /traxent/resend/webhook_secret.
    Value: !Sub "https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/resend"
  SubscribersTableName:
    Value: !Ref SubscribersTable
  NewsApiUrl:
    Description: News feed endpoint (Funded tier) = ApiBaseUrl + /news.
    Value: !Sub "https://${UserDataApi}.execute-api.${AWS::Region}.amazonaws.com/news"
  TableName:
    Value: !Ref UserDataTable
