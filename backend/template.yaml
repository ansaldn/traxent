AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Traxent backend

# This template mirrors the live `traxent-backend` CloudFormation stack 1:1, so a
# `sam deploy` reconciles it IN PLACE — same API id (da579ew81m), same URL, same
# function names, same routes. The ONLY difference from the deployed copy is that
# CodeUri points at the local function folders (so CI `sam build` can package and
# ship code), instead of the S3 artifact paths CloudFormation stored.
#
# Deployed by .github/workflows/deploy-payments.yml to stack `traxent-backend`.
# Logical IDs (TraxentApi, *Function) MUST stay as-is — they map to the live
# resources; renaming one would make CloudFormation delete + recreate it.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30

Resources:
  TraxentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: traxent-api
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,stripe-signature'"
        AllowOrigin: "'https://traxent.io'"

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-create-checkout
      CodeUri: functions/create-checkout/
      Handler: index.handler
      Environment:
        Variables:
          STRIPE_KEY_PARAM: /traxent/stripe/key_checkout
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: traxent/*
      Events:
        Api:
          Type: Api
          Properties:
            Path: /checkout
            Method: post
            RestApiId: !Ref TraxentApi

  # Webhook idempotency ledger — one row per processed Stripe event id, so a
  # retried delivery can't run role changes / emails twice. Rows expire via TTL
  # after 3 days (Stripe's max retry window). The webhook fails OPEN if this
  # table is unreachable — dedup is protection, never a blocker.
  WebhookDedupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TraxentWebhookDedup
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-stripe-webhook
      CodeUri: functions/stripe-webhook/
      Handler: index.handler
      Environment:
        Variables:
          STRIPE_KEY_PARAM: /traxent/stripe/key_webhook
          SUBSCRIBERS_TABLE: TraxentSubscribers
          USER_DATA_TABLE: TraxentUserData
          WEBHOOK_DEDUP_TABLE: !Ref WebhookDedupTable
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: traxent/*
        # Both tables are owned by the traxent-user-data stack, so they are
        # referenced by fixed name rather than !Ref. Deploy that stack first.
        - DynamoDBCrudPolicy:
            TableName: TraxentSubscribers
        # PROFILE plan/email mirror — the weekly readiness digest's send list.
        - DynamoDBCrudPolicy:
            TableName: TraxentUserData
        - DynamoDBCrudPolicy:
            TableName: !Ref WebhookDedupTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /webhooks/stripe
            Method: post
            RestApiId: !Ref TraxentApi

  CancelSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-cancel-subscription
      CodeUri: functions/cancel-subscription/
      Handler: index.handler
      Environment:
        Variables:
          STRIPE_KEY_PARAM: /traxent/stripe/key_cancel
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: traxent/*
      Events:
        Api:
          Type: Api
          Properties:
            Path: /cancel
            Method: post
            RestApiId: !Ref TraxentApi

  # Upgrade/downgrade an existing subscription in place, with Stripe proration.
  # (create-checkout is only for first-time subscribers.) New route on the same API.
  ChangePlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: traxent-change-plan
      CodeUri: functions/change-plan/
      Handler: index.handler
      Environment:
        Variables:
          STRIPE_KEY_PARAM: /traxent/stripe/key_change_plan
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: traxent/*
      Events:
        Api:
          Type: Api
          Properties:
            Path: /change-plan
            Method: post
            RestApiId: !Ref TraxentApi

Outputs:
  ApiUrl:
    Value: !Sub "https://${TraxentApi}.execute-api.eu-west-2.amazonaws.com/prod"
    Description: Traxent API endpoint
