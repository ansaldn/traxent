name: Deploy to S3

on:
  push:
    branches:
      - main
  # Allow other workflows (e.g. Scheduled Release) to trigger a deploy explicitly.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Stamp build SHA into Service Worker and auth.js references
        run: |
          # Stamp the commit SHA into sw.js (cache name) AND into every
          # HTML <script src="auth.js?v=__BUILD_SHA__"> reference. Because the
          # HTML is served no-cache, each deploy points browsers at a fresh
          # auth.js URL — so a stale auth.js can never be reused, regardless
          # of the CloudFront 4h max-age on .js files.
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA::8}/g" src/sw.js src/*.html
          echo "sw.js CACHE_NAME after stamping:"
          grep CACHE_NAME src/sw.js
          echo "auth.js references after stamping:"
          grep -h 'src="/\?auth.js' src/*.html | sort -u

      - name: Regenerate content catalogs from lesson HTML
        run: |
          # Rebuilds src/content/modules.json (schemaVersion 2) from the lesson
          # pages on EVERY deploy, so lesson/quiz edits reach iOS users without
          # an App Store release — iOS fetches /content/modules.json each launch.
          # Fail-open: if the extractor breaks, warn loudly and ship the last
          # committed catalog rather than blocking the whole site deploy.
          pip install --quiet beautifulsoup4 json5 cairosvg || true
          set +e
          python3 tools/extract_content.py . /tmp/content_out
          extract_ok=$?
          set -e
          if [ "$extract_ok" -eq 0 ] && python3 -c "
          import json,sys
          d=json.load(open('/tmp/content_out/Modules.json'))
          assert d.get('schemaVersion')==2, 'wrong schemaVersion'
          assert len(d.get('modules',[]))>=10, 'fewer than 10 modules'
          "; then
            cp /tmp/content_out/Modules.json src/content/modules.json
            echo "modules.json regenerated: $(python3 -c "import json;d=json.load(open('src/content/modules.json'));print(len(d['modules']),'modules')")"
          else
            echo "::warning::content extractor failed — shipping the committed src/content/modules.json unchanged"
          fi

      - name: Inject CSP script hashes (pilot pages)
        run: |
          # CSP Phase 2 (see CSP-REFACTOR.md): hash every inline script/handler on
          # the pilot pages and append to their CSP meta. Modern browsers then
          # ignore 'unsafe-inline' and enforce the hashes; legacy browsers keep
          # working. MUST run after the __BUILD_SHA__ stamping (hashes cover the
          # final bytes). Deploy-time only — nothing is committed to the pages.
          node scripts/csp-hash.mjs src

      - name: Verify HTML integrity (guard against truncated files)
        run: |
          # OneDrive has silently truncated HTML file tails before (eating the
          # closing </script></body></html> and breaking inline scripts). Fail
          # the deploy loudly rather than ship a corrupted page.
          fail=0
          for f in src/*.html; do
            if ! tail -c 16 "$f" | tr -d '[:space:]' | grep -q '</html>'; then
              echo "::error file=$f::Truncated HTML — file does not end with </html>"
              fail=1
            fi
            open=$(grep -o '<script' "$f" | wc -l)
            close=$(grep -o '</script>' "$f" | wc -l)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::Unbalanced script tags ($open <script> vs $close </script>)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Deploy aborted: one or more HTML files look truncated/corrupted."
            exit 1
          fi
          echo "HTML integrity check passed — all pages end in </html> with balanced <script> tags."

      - name: Reject cloud-sync conflict copies
        run: |
          # OneDrive/iCloud append " 2" to a filename when they can't resolve a
          # conflict. Anything left in src/ gets published — traxent.io/privacy 2.html
          # is a real thing that would otherwise go live and confuse crawlers.
          found=$(find src -name "* [0-9].*" -o -name "* copy.*" | head -20)
          if [ -n "$found" ]; then
            echo "::error::Cloud-sync conflict copies found in src/ — delete them before deploying:"
            echo "$found"
            exit 1
          fi
          echo "No sync-conflict files in src/."

      - name: Deploy to S3
        run: |
          # Pass 1: upload everything (and handle deletions) with a long,
          # immutable cache. Safe for content-stable assets like icons/logo.
          aws s3 sync src/ s3://traxent.io \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Pass 2: re-upload the files that change every release with
          # `no-cache` so browsers always revalidate them. Without this, a
          # 24h browser cache kept serving a stale auth.js (old Auth0
          # `audience`) and the login page would not load until the cache
          # expired. CloudFront invalidation does NOT fix browser caches.
          aws s3 cp src/ s3://traxent.io --recursive \
            --exclude "*" \
            --include "*.html" \
            --include "auth.js" \
            --include "userdata.js" \
            --include "sw.js" \
            --include "config.js" \
            --include "consent.js" \
            --include "flags.js" \
            --include "flags.json" \
            --include "subscribe.js" \
            --include "launch-state.js" \
            --include "content/*.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"